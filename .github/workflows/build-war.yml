name: Build WAR

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Workflow commits the rebuilt WAR back to the repo
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download servlet API jar
        run: |
          mkdir -p .github/build-tools
          curl -fsSL -o .github/build-tools/javax.servlet-api-4.0.1.jar \
            https://repo1.maven.org/maven2/javax/servlet/javax.servlet-api/4.0.1/javax.servlet-api-4.0.1.jar

      - name: Build WAR
        run: sh ./scripts/build-war.sh

      - name: Commit rebuilt WAR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FoodApp.war
          if git diff --cached --quiet; then
            echo "WAR unchanged - nothing to commit"
          else
            git commit -m "CI: rebuild FoodApp.war from latest sources"
            git push
          fi
